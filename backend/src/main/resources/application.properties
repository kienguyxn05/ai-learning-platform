spring.application.name=ai-learning-platform-backend
server.port=8080

# Cấu hình DataSource PostgreSQL (Supabase)
# Bạn có thể override bằng biến môi trường SPRING_DATASOURCE_URL, USERNAME, PASSWORD
spring.datasource.url=jdbc:postgresql://db.lbivfweabbowohhvxjwm.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:your-database-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "none" hoặc "validate" để dùng schema.sql có sẵn từ Phase 3, không ghi đè cấu trúc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình CORS để cho phép Next.js (port 3000) gọi API
